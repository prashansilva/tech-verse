<div class="cart-item">
  <div class="cart-thumb" [class]="item.product.color">
    <div class="mini-art" [innerHTML]="item.product.image | productImage"></div>
  </div>
  <div class="cart-detail">
    <h4>{{ item.product.name }}</h4>
    <p>
      <span class="material-symbols-rounded">palette</span>&nbsp;{{
        item.product.category === "smart-home" ? "Multi-Color" : "Graphite"
      }}
    </p>
    <strong>{{
      item.product.price | currency: "USD" : "symbol" : "1.2-2"
    }}</strong>
  </div>
  <div class="qty">
    <button disabled aria-label="Decrease quantity"><span class="material-symbols-rounded">remove</span></button><span>{{ item.quantity }}</span
    ><button disabled aria-label="Increase quantity"><span class="material-symbols-rounded">add</span></button>
  </div>
  <button class="remove" disabled aria-label="Remove item"><span class="material-symbols-rounded">delete_outline</span></button>
</div>
