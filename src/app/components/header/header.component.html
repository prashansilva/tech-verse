<header class="topbar">
  <a class="brand" href="#" aria-label="TechVerse home"
    ><span class="brand-mark">V</span><span>Tech<span>Verse</span></span></a
  >
  <nav class="main-nav">
    <a class="active" href="#">Home</a><a href="#products">Shop</a
    ><a href="#categories">Categories</a><a href="#new">New Arrivals</a
    ><a class="deals" href="#deals">Deals</a>
  </nav>
  <div class="header-actions">
    <label class="search"
      ><span class="material-symbols-rounded">search</span
      ><input
        [(ngModel)]="search"
        (ngModelChange)="searchChange.emit($event)"
        placeholder="Search for laptops, headphones, smart home..."
        aria-label="Search products" /></label
    ><button class="icon-btn" aria-label="Favorites"><span class="material-symbols-rounded">favorite_border</span></button
    ><button class="icon-btn bell" aria-label="Notifications"><span class="material-symbols-rounded">notifications_none</span><i></i></button
    ><button
      class="icon-btn cart-trigger"
      aria-label="Cart"
    >
      <span class="material-symbols-rounded">shopping_cart</span><b>{{ cartCount }}</b>
    </button>
    <div class="avatar">SA</div>
  </div>
  <button class="mobile-menu" (click)="menuToggle.emit()"><span class="material-symbols-rounded">menu</span></button>
</header>
