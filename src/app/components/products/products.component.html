<section class="catalog">
  <div class="catalog-head">
    <div>
      <h2>
        Electronics <small>{{ products.length | number }} products</small>
      </h2>
    </div>
    <div class="sort">
      Sort by:
      <select [ngModel]="sort" (ngModelChange)="sortChange.emit($event)">
        <option>Newest</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option></select
      ><button class="view active" aria-label="Grid view"><span class="material-symbols-rounded">grid_view</span></button><button class="view" aria-label="List view"><span class="material-symbols-rounded">view_list</span></button>
    </div>
  </div>
  <div class="category-tabs">
    <button
      *ngFor="let c of categories"
      [class.active]="selectedCategory === c"
      (click)="categoryChange.emit(c)"
    >
      {{ c }}
    </button>
  </div>
  <div class="product-scroll">
    <div class="product-grid">
        @for ( product of products; track product.id ) {
            <app-product-card
                [product]="product"
                [favoriteState]="favorites.has(product.id)"
                (favorite)="favorite.emit($event)"
            ></app-product-card>
        }
    </div>
      @if ( !showAll ) {
          <button class="load-more" (click)="loadMore.emit()">
              Load more products <span class="material-symbols-rounded">expand_more</span>
          </button>
      }
  </div>
</section>
