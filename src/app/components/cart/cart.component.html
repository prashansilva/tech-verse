<aside class="cart-panel">
  <div class="cart-head">
    <h2>
      Your Cart <span>({{ count }})</span>
    </h2>
    <button aria-label="Cart section"><span class="material-symbols-rounded">close</span></button>
  </div>
  <div class="cart-items">
    <app-cart-item *ngFor="let item of items" [item]="item"></app-cart-item>
  </div>
  <div class="cart-summary">
    <div>
      <span>Subtotal</span
      ><strong>{{ subtotal | currency: "USD" : "symbol" : "1.2-2" }}</strong>
    </div>
    <div><span>Shipping</span><strong class="free">Free</strong></div>
    <div>
      <span>Estimated Tax</span
      ><strong>{{ tax | currency: "USD" : "symbol" : "1.2-2" }}</strong>
    </div>
    <div class="total">
      <span>Total</span
      ><strong>{{ total | currency: "USD" : "symbol" : "1.2-2" }}</strong>
    </div>
  </div>
  <button class="checkout" [disabled]="!items.length">
  Proceed to Checkout <span class="material-symbols-rounded">arrow_forward</span></button
  ><button class="view-cart">View Cart</button>
</aside>
