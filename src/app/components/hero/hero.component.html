<section class="hero" id="new">
  <div class="hero-copy">
    <div class="eyebrow">NEW LAUNCH <span></span></div>
    <h1>Next-Gen<br />Audio Experience</h1>
    <p>
      Premium wireless headphones with immersive sound, all-day comfort, and
      ANC.
    </p>
    <button class="primary" (click)="shopHeadphones.emit()">
      Shop Headphones <span class="material-symbols-rounded">arrow_forward</span></button
    ><button class="secondary">Explore Audio</button>
  </div>
  <div class="hero-art">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>
    <div class="headphone">
      <div class="band"></div>
      <div class="ear left"><span>◁</span></div>
      <div class="ear right"><span>◁</span></div>
    </div>
    <div class="hero-platform"></div>
  </div>
  <div class="hero-dots"><b></b><i></i><i></i></div>
</section>
